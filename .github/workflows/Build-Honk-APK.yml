name: 编译并发布 luci-app-honk

run-name: Honk APK · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'luci-app-honk/**'
      - '.github/workflows/Build-Honk-APK.yml'

permissions:
  contents: write

concurrency:
  group: publish-honk-apk
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: 编译 ${{ matrix.platform_name }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            platform_name: ARM64
            architecture: aarch64
            sdk_path: qualcommax/ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
            target: qualcommax
            subtarget: ipq60xx
          - platform: amd64
            platform_name: AMD64
            architecture: x86_64
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-x86-64_
            target: x86
            subtarget: '64'
    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/snapshots/targets/${{ matrix.sdk_path }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}
      PACKAGE_DIR: luci-app-honk
    steps:
      - name: 检出
        uses: actions/checkout@main
        with:
          persist-credentials: false

      # 配置里 section 一旦重名，uci 会整份拒收，症状是 LuCI 菜单消失或整站 500。
      # 本地那套校验查不出来，所以放进 CI 当硬门禁。
      - name: 校验 UCI 配置
        run: |
          python3 "$PACKAGE_DIR/tools/check-uci-sections.py" \
            "$PACKAGE_DIR/root/etc/config/honk"

      - name: 安装 SDK 依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip wget xsltproc zip zlib1g-dev zstd

      - name: 确定 ImmortalWrt SDK
        id: sdk
        run: |
          sums_file="$RUNNER_TEMP/immortalwrt-sha256sums"
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$sums_file"
          archive=''
          sha256=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < "$sums_file"
          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: 缓存 ImmortalWrt SDK
        uses: actions/cache@main
        with:
          path: ~/.cache/immortalwrt-sdk/${{ matrix.platform }}
          key: immortalwrt-sdk-${{ matrix.platform }}-${{ steps.sdk.outputs.sha256 }}

      - name: 下载并解压 ImmortalWrt SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          cache_dir="$HOME/.cache/immortalwrt-sdk/${{ matrix.platform }}"
          archive_path="$cache_dir/$SDK_ARCHIVE"
          extract_dir="$RUNNER_TEMP/immortalwrt-sdk"
          mkdir -p "$cache_dir"

          if [[ ! -f "$archive_path" ]] || \
             [[ "$(sha256sum "$archive_path" | cut -d' ' -f1)" != "$SDK_SHA256" ]]; then
            rm -f "$archive_path"
            curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive_path"
          fi

          echo "$SDK_SHA256  $archive_path" | sha256sum -c -
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar --zstd -xf "$archive_path" -C "$extract_dir"
          sdk_root="$(find "$extract_dir" -mindepth 1 -maxdepth 1 \
            -type d -name 'immortalwrt-sdk-*' -print -quit)"
          [[ -n "$sdk_root" ]]
          echo "SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: 把包放进 SDK
        run: |
          mkdir -p "$SDK_ROOT/package/luci-app-honk"
          cp -a "$GITHUB_WORKSPACE/$PACKAGE_DIR/." "$SDK_ROOT/package/luci-app-honk/"
          test -f "$SDK_ROOT/package/luci-app-honk/Makefile"
          chmod +x "$SDK_ROOT/package/luci-app-honk/root/etc/init.d/honk" 2>/dev/null || true
          chmod +x "$SDK_ROOT/package/luci-app-honk/root/usr/share/honk/"*.sh 2>/dev/null || true

      # honk-core 是预编译的静态二进制，不在这里编译，直接按架构取官方 release。
      # stock 版用系统 /sys/kernel/btf/vmlinux，不需要配套的 vmlinux-btf-builtin。
      - name: 放入 honk-core
        env:
          HONK_CORE_VER: v0.1.0-beta.6
        run: |
          case "${{ matrix.platform }}" in
            arm64) CORE_ARCH=aarch64 ;;
            amd64) CORE_ARCH=x86_64 ;;
            *) echo "::error::unknown platform"; exit 1 ;;
          esac

          url="https://github.com/daeuniverse/honk/releases/download/${HONK_CORE_VER}/honk-core-${HONK_CORE_VER}-${CORE_ARCH}-unknown-linux-musl-stock-native-api.tar.gz"
          echo "fetching $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/honk-core.tar.gz" "$url"
          mkdir -p "$RUNNER_TEMP/honk-core-extract"
          tar -xzf "$RUNNER_TEMP/honk-core.tar.gz" -C "$RUNNER_TEMP/honk-core-extract"

          bin="$(find "$RUNNER_TEMP/honk-core-extract" -name honk-core -type f -print -quit)"
          [ -n "$bin" ] || { echo "::error::honk-core not found in archive"; exit 1; }

          mkdir -p "$SDK_ROOT/package/luci-app-honk/root/usr/bin"
          cp "$bin" "$SDK_ROOT/package/luci-app-honk/root/usr/bin/honk-core"
          chmod 755 "$SDK_ROOT/package/luci-app-honk/root/usr/bin/honk-core"
          ls -l "$SDK_ROOT/package/luci-app-honk/root/usr/bin/honk-core"

      - name: 准备软件包源
        run: |
          cache_dir="$HOME/.cache/immortalwrt-dl/${{ matrix.platform }}"
          mkdir -p "$cache_dir"
          rm -rf "$SDK_ROOT/dl"
          ln -s "$cache_dir" "$SDK_ROOT/dl"
          "$SDK_ROOT/scripts/feeds" update -a
          "$SDK_ROOT/scripts/feeds" install -a

      - name: 配置
        run: |
          cd "$SDK_ROOT"
          echo "CONFIG_PACKAGE_luci-app-honk=m" >> .config
          make defconfig

      - name: 编译
        run: |
          cd "$SDK_ROOT"
          make package/luci-app-honk/compile -j$(nproc) V=s || make package/luci-app-honk/compile -j1 V=s

      - name: 收集产物
        run: |
          out="$RUNNER_TEMP/honk-apk"
          mkdir -p "$out"
          found=0
          while IFS= read -r f; do
            cp -v "$f" "$out/"
            found=$((found + 1))
          done < <(find "$SDK_ROOT/bin" \( -name 'luci-app-honk*.apk' -o -name 'luci-app-honk*.ipk' \) 2>/dev/null)
          (( found > 0 )) || { echo "::error::没有找到 luci-app-honk 的包"; exit 1; }
          cd "$out" && sha256sum -- * > SHA256SUMS
          ls -l "$out"

      - name: 上传 ${{ matrix.platform_name }} 产物
        uses: actions/upload-artifact@main
        with:
          name: honk-apk-${{ matrix.platform }}
          path: ${{ runner.temp }}/honk-apk
          if-no-files-found: error
          retention-days: 3

  publish:
    name: 发布 ${{ matrix.platform_name }} APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            platform_name: ARM64
            architecture: aarch64
            release_tag: honk-apk-arm64
          - platform: amd64
            platform_name: AMD64
            architecture: x86_64
            release_tag: honk-apk-amd64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ matrix.release_tag }}
    steps:
      - name: 下载产物
        uses: actions/download-artifact@main
        with:
          name: honk-apk-${{ matrix.platform }}
          path: ${{ runner.temp }}/honk-apk

      - name: 发布
        run: |
          dir="$RUNNER_TEMP/honk-apk"
          notes="$RUNNER_TEMP/notes.md"
          assets=()
          while IFS= read -r f; do assets+=("$dir/$f"); done < <(cd "$dir" && ls *.apk *.ipk 2>/dev/null)
          (( ${#assets[@]} > 0 )) || { echo "::error::没有可发布的包"; exit 1; }

          {
            echo 'luci-app-honk：honk（eBPF 透明代理）的 LuCI 前端。'
            echo
            echo '平台：${{ matrix.platform_name }}'
            echo '架构：${{ matrix.architecture }}'
            echo
            echo '**本包不含 honk-core**，需从 daeuniverse 的 apk 源单独安装：'
            echo
            echo '\`\`\`sh'
            echo 'wget -O /etc/apk/keys/daeuniverse.pem https://openwrt.daeuniverse.org/public-key.pem'
            echo '. /etc/openwrt_release'
            echo 'FEED="https://openwrt.daeuniverse.org/$(echo $DISTRIB_RELEASE | cut -d. -f1-2)"'
            echo 'echo "$FEED/packages.adb" >> /etc/apk/repositories.d/daeuniverse.list'
            echo 'apk update && apk add honk vmlinux-btf-builtin'
            echo '\`\`\`'
          } > "$notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "luci-app-honk（${{ matrix.platform_name }}）" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "luci-app-honk（${{ matrix.platform_name }}）" --notes-file "$notes"
          fi

      - name: 摘要
        run: echo "### Honk APK 已发布：${{ matrix.platform_name }}" >> "$GITHUB_STEP_SUMMARY"