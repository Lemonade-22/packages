name: 编译并发布 Honk APK

run-name: Honk APK @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'luci-app-honk/**'
      - '.github/workflows/Build-Honk-APK.yml'

permissions:
  contents: read

concurrency:
  group: publish-honk-apk
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: 编译 ${{ matrix.platform_name }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            platform_name: ARM64
            sdk_path: qualcommax/ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
            target: qualcommax
            subtarget: ipq60xx
          - platform: amd64
            platform_name: AMD64
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-x86-64_
            target: x86
            subtarget: '64'
    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/snapshots/targets/${{ matrix.sdk_path }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}
      PACKAGE_DIR: luci-app-honk
    steps:
      - name: 检出
        uses: actions/checkout@main
        with:
          persist-credentials: false

      # 配置里的 section 一旦重名，uci 会整份拒收，症状是 LuCI 菜单消失或整站 500。
      # 本地那套校验查不出来，所以放进 CI 当作硬门禁。
      - name: 校验 UCI 配置
        run: |
          python3 "$PACKAGE_DIR/tools/check-uci-sections.py" \
            "$PACKAGE_DIR/root/etc/config/honk"

      - name: 安装 SDK 依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip wget xsltproc zip zlib1g-dev zstd

      - name: 验证软件包文件权限
        run: |
          .github/scripts/fix-package-permissions.sh "$PACKAGE_DIR"
          git diff --exit-code

      - name: 确定 ImmortalWrt SDK
        id: sdk
        run: |
          sums_file="$RUNNER_TEMP/immortalwrt-sha256sums"
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$sums_file"
          archive=''
          sha256=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < "$sums_file"
          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: 缓存 ImmortalWrt SDK
        uses: actions/cache@main
        with:
          path: ~/.cache/immortalwrt-sdk/${{ matrix.platform }}
          key: immortalwrt-sdk-${{ matrix.platform }}-${{ steps.sdk.outputs.sha256 }}

      - name: 下载并解压 ImmortalWrt SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          cache_dir="$HOME/.cache/immortalwrt-sdk/${{ matrix.platform }}"
          archive_path="$cache_dir/$SDK_ARCHIVE"
          extract_dir="$RUNNER_TEMP/immortalwrt-sdk"
          mkdir -p "$cache_dir"

          if [[ ! -f "$archive_path" ]] || \
             [[ "$(sha256sum "$archive_path" | cut -d' ' -f1)" != "$SDK_SHA256" ]]; then
            rm -f "$archive_path"
            curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive_path"
          fi

          echo "$SDK_SHA256  $archive_path" | sha256sum -c -
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar --zstd -xf "$archive_path" -C "$extract_dir"
          sdk_root="$(find "$extract_dir" -mindepth 1 -maxdepth 1 \
            -type d -name 'immortalwrt-sdk-*' -print -quit)"
          [[ -n "$sdk_root" ]]
          echo "SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: 确定滚动下载缓存版本
        id: cache
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 缓存软件包下载
        uses: actions/cache@main
        with:
          path: ~/.cache/immortalwrt-dl/${{ matrix.platform }}
          key: immortalwrt-dl-${{ matrix.platform }}-${{ steps.cache.outputs.date }}-${{ hashFiles('luci-app-honk/Makefile') }}
          restore-keys: |
            immortalwrt-dl-${{ matrix.platform }}-${{ steps.cache.outputs.date }}-
            immortalwrt-dl-${{ matrix.platform }}-

      - name: 准备软件包源
        run: |
          cache_dir="$HOME/.cache/immortalwrt-dl/${{ matrix.platform }}"
          mkdir -p "$cache_dir"
          rm -rf "$SDK_ROOT/dl"
          ln -s "$cache_dir" "$SDK_ROOT/dl"
          "$SDK_ROOT/scripts/feeds" update -a
          "$SDK_ROOT/scripts/feeds" install -a

      - name: 编译 ${{ matrix.platform_name }} APK
        run: |
          .github/scripts/build-apk-packages.sh \
            "$SDK_ROOT" \
            "$RUNNER_TEMP/apk-output" \
            '${{ matrix.target }}' \
            '${{ matrix.subtarget }}' \
            "$PACKAGE_DIR"

      - name: 上传 ${{ matrix.platform_name }} 编译结果
        uses: actions/upload-artifact@main
        with:
          name: honk-apk-${{ matrix.platform }}
          path: ${{ runner.temp }}/apk-output
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布 ${{ matrix.platform_name }} APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            platform_name: ARM64
            architecture: aarch64
            sdk_target: qualcommax/ipq60xx
            release_tag: honk-apk-arm64
          - platform: amd64
            platform_name: AMD64
            architecture: x86_64
            sdk_target: x86/64
            release_tag: honk-apk-amd64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: 检出
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: 下载编译结果
        uses: actions/download-artifact@main
        with:
          name: honk-apk-${{ matrix.platform }}
          path: ${{ runner.temp }}/apk-output

      - name: 验证产物
        run: |
          output_dir="$RUNNER_TEMP/apk-output"
          tool_dir="$RUNNER_TEMP/apk-tools"
          mkdir -p "$tool_dir"
          tar -xzf "$output_dir/tools/apk-tools.tar.gz" -C "$tool_dir"
          "$tool_dir/bin/apk" --version
          (
            cd "$output_dir"
            sha256sum --check --strict SHA256SUMS
          )

      - name: 发布
        run: |
          output_dir="$RUNNER_TEMP/apk-output"
          notes_file="$RUNNER_TEMP/honk-release-notes.md"
          assets=()
          while IFS=$'\\t' read -r filename _; do
            assets+=("$output_dir/$filename")
          done < "$output_dir/APK-MANIFEST.tsv"
          (( ${#assets[@]} > 0 ))

          {
            echo 'luci-app-honk APK 软件包。'
            echo
            echo '平台：${{ matrix.platform_name }}'
            echo '架构：${{ matrix.architecture }}'
            echo 'SDK 目标：${{ matrix.sdk_target }}'
            echo "源提交：$SOURCE_SHA"
            echo
            echo '注意：本包只是 LuCI 前端，honk-core 需从 daeuniverse 的 apk 源单独安装。'
            echo '每个包名仅保留最新版本。'
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'luci-app-honk（${{ matrix.platform_name }}）' \
              --notes-file "$notes_file" \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title 'luci-app-honk（${{ matrix.platform_name }}）' \
              --notes-file "$notes_file"
          fi

      - name: 每个软件包仅保留最新版本
        run: |
          .github/scripts/prune-apk-release.sh \
            "$RELEASE_TAG" 1 "$RUNNER_TEMP/latest-apk-assets.tsv"

      - name: 摘要
        run: |
          echo "### Honk APK 已发布：${{ matrix.platform_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "标签：`$RELEASE_TAG`" >> "$GITHUB_STEP_SUMMARY"